name: Playwright Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  SITE_URL: https://www.convrrt.com

jobs:
  # ── Smoke tests — run first as a fast gate ────────────────────────────────
  smoke:
    name: Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run smoke tests
        run: npx playwright test --grep @smoke --project=chromium-desktop

      - name: Upload smoke results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # ── Full suite — runs only when smoke passes ───────────────────────────────
  full-suite:
    name: Full Test Suite
    runs-on: ubuntu-latest
    needs: smoke
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Run navigation tests
        run: npx playwright test --grep @navigation --project=chromium-desktop

      - name: Run forms tests
        run: npx playwright test --grep @forms --project=chromium-desktop

      - name: Run functional tests
        run: npx playwright test --grep @functional --project=chromium-desktop

      - name: Run responsive tests
        run: npx playwright test --grep @responsive

      - name: Upload full suite results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-suite-results
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  # ── Visual regression — separate job, requires baseline ───────────────────
  visual:
    name: Visual Regression
    runs-on: ubuntu-latest
    needs: smoke
    timeout-minutes: 15
    # Only run visual tests when __snapshots__ directory exists (baselines committed)
    if: ${{ hashFiles('__snapshots__/**') != '' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run visual tests
        run: npx playwright test --grep @visual --project=chromium-desktop

      - name: Upload visual diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diffs
          path: test-results/
          retention-days: 7
